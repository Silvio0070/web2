<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículo</title>
</head>
<body>
    <h1>Cadastro de Currículo</h1>
    <form action="Dadoscurriculo.php" method="post">
        <fieldset>
            <legend>Informações Pessoais</legend>
            <label for="nome_id">Nome:</label>
            <input placeholder="Digite o seu nome" type="text" name="nome" id="nome_id" required><br>

            <label for="email_id">Email:</label>
            <input placeholder="Digite o seu email" type="email" name="email" id="email_id" required><br>

            <label for="nasc_id">Data de Nascimento:</label>
            <input type="date" name="nasc" id="nasc_id" required><br>

            <label for="alt_id">Altura(m):</label>
            <input type="number" name="alt" id="alt_id" step="0.01" min="0.5" max="2.5" required><br>

            <label for="site_id">Site:</label>
            <input placeholder="Facebook, Linkedin, Lattes..." type="url" name="site" id="site_id"><br>

            <label for="ec_id">Estado Civil:</label>
            <select name="ec" id="ec_id" required>
                <option value="">Selecione</option>
                <option value="Solteiro">Solteiro</option>
                <option value="Casado">Casado</option>
                <option value="Divorciado">Divorciado</option>
                <option value="Viúvo">Viúvo</option>
            </select><br>

            Sexo:
            <input type="radio" name="sexo" id="masc_id" value="Masculino" required>
            <label for="masc_id">Masculino</label>
            <input type="radio" name="sexo" id="fem_id" value="Feminino">
            <label for="fem_id">Feminino</label>
        </fieldset>

        <fieldset>
            <legend>Endereço</legend>
            <label for="cep_id">CEP:</label>
            <input type="text" name="cep" id="cep_id" placeholder="64000-000" pattern="[0-9]{5}-?[0-9]{3}" required><br>

            <label for="end_id">Endereço:</label>
            <input type="text" name="end" id="end_id" required><br>
        </fieldset>

        <fieldset>
            <legend>Contato</legend>
            <label for="telef_id">Telefone:</label>
            <input placeholder="(86) 99999-9999" pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" type="tel" name="telef" id="telef_id" required><br>

            <label for="celular_id">Celular:</label>
            <input placeholder="(86) 99999-9999" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" type="tel" name="celular" id="celular_id" required><br>
        </fieldset>

        <fieldset>
            <legend>Conhecimentos</legend>
            <input type="checkbox" name="conhecimentos[]" id="html_id" value="HTML">
            <label for="html_id">HTML</label>
            <input type="checkbox" name="conhecimentos[]" id="css_id" value="CSS">
            <label for="css_id">CSS</label>
            <input type="checkbox" name="conhecimentos[]" id="js_id" value="JavaScript">
            <label for="js_id">JavaScript</label>
            <br>
            <label for="mais_id">Mais conhecimentos</label>
            <textarea id="mais_id" name="mais" cols="30" rows="5" placeholder="Digite os seus conhecimentos"></textarea>
        </fieldset>

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
